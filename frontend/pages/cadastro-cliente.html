<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Cliente - AutoCheck Manager</title>
    <link rel="stylesheet" href="../styles.css" />
</head>

<body>
    <main class="shell layout">
        <section class="card split">
            <div>
                <div id="top-nav"></div>
                <div class="page-head">
                    <div>
                        <h2>Cadastro de Cliente</h2>
                        <p class="hint">Registre os dados essenciais para abrir ordens de servico sem retrabalho.</p>
                    </div>
                    <span class="tag">Passo 1 de 3</span>
                </div>

                <form id="cliente-form">
                    <div class="grid-2">
                        <label>Nome
                            <input type="text" id="nome" required />
                        </label>
                        <label>Telefone
                            <input type="tel" id="telefone" required />
                        </label>
                    </div>

                    <div class="grid-2">
                        <label>Email
                            <input type="email" id="email" />
                        </label>
                        <label>CPF
                            <input type="text" id="cpf" required />
                        </label>
                    </div>

                    <label>Endereco
                        <textarea id="endereco" required></textarea>
                    </label>

                    <button class="btn primary" type="submit">Salvar Cliente</button>
                    <div id="msg"></div>
                </form>
            </div>

            <aside class="card">
                <h2>Boas praticas</h2>
                <ul class="list">
                    <li>Use telefone com DDD para facilitar contato.</li>
                    <li>CPF unico evita duplicidade de cadastro.</li>
                    <li>Endereco ajuda na logistica de retirada.</li>
                </ul>
            </aside>
        </section>

        <section class="card">
            <div class="list-head">
                <h2>Clientes Cadastrados</h2>
                <span id="clientes-count" class="count-badge">0 registros</span>
            </div>
            <ul id="clientes-lista" class="list"></ul>
        </section>
    </main>

    <script src="../app.js"></script>
    <script>
        document.getElementById("top-nav").innerHTML = buildTopNav("cliente");
        initTheme();

        function updateCount() {
            const total = getData(DB_KEYS.clients).length;
            document.getElementById("clientes-count").textContent = `${total} ${total === 1 ? "registro" : "registros"}`;
        }

        document.getElementById("cliente-form").addEventListener("submit", function (e) {
            e.preventDefault();

            const clients = getData(DB_KEYS.clients);
            const cpf = document.getElementById("cpf").value.trim();
            const alreadyCpf = clients.some(c => c.cpf === cpf);

            if (alreadyCpf) {
                showMessage("msg", "CPF ja cadastrado.", "error");
                return;
            }

            const newClient = {
                id: Date.now(),
                nome: document.getElementById("nome").value.trim(),
                telefone: document.getElementById("telefone").value.trim(),
                email: document.getElementById("email").value.trim(),
                cpf,
                endereco: document.getElementById("endereco").value.trim()
            };

            clients.push(newClient);
            setData(DB_KEYS.clients, clients);
            this.reset();
            showMessage("msg", "Cliente cadastrado com sucesso.", "ok");
            renderClientsList("clientes-lista");
            updateCount();
        });

        renderClientsList("clientes-lista");
        updateCount();
    </script>
</body>

</html>
